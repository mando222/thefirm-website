    var p = document.body || document.documentElement;

    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

   --gold:#9a7b3f;\n    --line:#dcd8cb;\n    --serif:'Cormorant Garamond', Georgia, serif;\n    --sans:'Hanken Grotesk', system-ui, sans-serif;\n    --wrap:1200px;\n    --shadow:0 18px 40px -22px rgba(35,37,31,.4);\n  }\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{\n    margin:0; background:var(--paper); color:var(--ink);\n    font-family:var(--sans); font-size:17px; line-height:1.6;\n    -webkit-font-smoothing:antialiased;\n  }\n  img{display:block; max-width:100%;}\n  a{color:inherit; text-decoration:none;}\n  section{scroll-margin-top:88px;}\n  .wrap{max-width:var(--wrap); margin:0 auto; padding:0 28px;}\n\n  .eyebrow{\n    font-family:var(--sans); font-size:12px; font-weight:600;\n    letter-spacing:.22em; text-transform:uppercase; color:var(--green);\n    display:inline-flex; align-items:center; gap:10px; margin:0 0 18px;\n  }\n  .eyebrow::before{content:\"\"; width:26px; height:1.5px; background:var(--gold);}\n  .eyebrow.center{justify-content:center;}\n  h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.04; margin:0; letter-spacing:.01em;}\n  h2.title{font-size:clamp(30px,4.4vw,52px);}\n  p{margin:0 0 16px; color:var(--ink-soft);} \n  .lead{font-size:19px; color:var(--ink-soft);}\n\n  .btn{\n    display:inline-flex; align-items:center; justify-content:center; gap:9px;\n    font-family:var(--sans); font-weight:600; font-size:15px; letter-spacing:.01em;\n    padding:14px 26px; border-radius:2px; border:1.5px solid transparent;\n    cursor:pointer; transition:all .18s ease; min-height:48px;\n  }\n  .btn-fill{background:var(--green); color:#fff;}\n  .btn-fill:hover{background:var(--green-700);}\n  .btn-out{background:transparent; color:var(--ink); border-color:var(--ink);}\n  .btn-out:hover{background:var(--ink); color:var(--paper);}\n  .btn-ghost-light{background:transparent; color:#fff; border-color:rgba(255,255,255,.6);}\n  .btn-ghost-light:hover{background:#fff; color:var(--green-700); border-color:#fff;}\n\n  /* ---------- header ---------- */\n  header{\n    position:fixed; top:0; left:0; right:0; z-index:100;\n    transition:background .25s ease, box-shadow .25s ease, padding .25s ease;\n    padding:18px 0;\n  }\n  header .wrap{display:flex; align-items:center; gap:24px;}\n  .brand{display:inline-flex; align-items:center;}\n  .brand img{height:56px; width:auto; display:block; transition:height .25s;}\n  nav.main{margin-left:auto; display:flex; align-items:center; gap:30px;}\n  nav.main a{font-size:14.5px; font-weight:500; color:rgba(255,255,255,.92); letter-spacing:.01em; transition:color .2s;}\n  nav.main a:hover{color:#fff;}\n  .header-cta{display:inline-flex; gap:12px; align-items:center;}\n  .phone-link{font-weight:600; font-size:14.5px; color:#fff; display:inline-flex; align-items:center; gap:7px;}\n  header.scrolled{background:rgba(20,28,22,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 1px 0 rgba(255,255,255,.1); padding:10px 0;}\n  header.scrolled .brand img{height:44px;}\n\n  .burger{display:none; flex-direction:column; gap:5px; margin-left:auto; background:none; border:none; cursor:pointer; padding:8px;}\n  .burger i{width:26px; height:2px; background:#fff; transition:.2s;}\n  header.scrolled .burger i{background:#fff;}\n\n  /* mobile menu */\n  .mobile-menu{\n    position:fixed; inset:0; z-index:99; background:var(--green-700);\n    display:flex; flex-direction:column; justify-content:center; gap:8px; padding:40px;\n    transform:translateY(-100%); transition:transform .32s cubic-bezier(.5,0,.2,1); visibility:hidden;\n  }\n  .mobile-menu.open{transform:translateY(0); visibility:visible;}\n  .mobile-menu a{font-family:var(--serif); font-size:34px; color:#fff; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.14);}\n  .mobile-menu .mm-foot{margin-top:24px; font-family:var(--sans);}\n  .mobile-menu .mm-foot a{font-size:16px; border:none; color:var(--green-300); display:block; padding:4px 0;}\n  .mm-close{position:absolute; top:24px; right:26px; background:none; border:none; color:#fff; font-size:34px; cursor:pointer; line-height:1;}\n\n  /* ---------- hero ---------- */\n  .hero{position:relative; min-height:100svh; display:flex; align-items:flex-end; color:#fff; overflow:hidden;}\n  .hero img.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}\n  .hero .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(16,22,16,.5) 0%, rgba(16,22,16,.18) 28%, rgba(16,22,16,.45) 58%, rgba(16,22,16,.86) 100%);}\n  .hero .wrap{position:relative; padding-top:150px; padding-bottom:84px; text-align:center;}\n  .hero .eyebrow{color:#e7ede4;}\n  .hero .eyebrow::before{background:var(--green-300);}\n  .hero h1{font-size:clamp(52px,9vw,116px); font-weight:600; line-height:1.08; letter-spacing:.01em; text-shadow:0 2px 30px rgba(0,0,0,.35);}\n  .hero .tagline{font-family:var(--serif); font-style:italic; font-size:clamp(20px,2.6vw,30px); color:#f2efe6; max-width:42rem; margin:24px auto 32px; line-height:1.25; text-shadow:0 1px 14px rgba(0,0,0,.4);}\n  .hero .actions{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}\n  .scroll-cue{position:absolute; bottom:26px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.7); display:flex; flex-direction:column; align-items:center; gap:8px;}\n  .scroll-cue::after{content:\"\"; width:1px; height:34px; background:rgba(255,255,255,.5); animation:cue 1.8s ease-in-out infinite;}\n  @keyframes cue{0%,100%{opacity:.3; transform:scaleY(.6);}50%{opacity:1; transform:scaleY(1);}}\n\n  /* ---------- philosophy ---------- */\n  .philosophy{padding:clamp(70px,11vw,128px) 0; text-align:center;}\n  .philosophy .quote{font-family:var(--serif); font-weight:500; font-size:clamp(30px,4.6vw,56px); line-height:1.12; max-width:18ch; margin:0 auto 26px; letter-spacing:.005em;}\n  .philosophy .quote .hl{color:var(--green); font-style:italic;}\n  .philosophy p{max-width:62ch; margin:0 auto; font-size:18px;}\n\n  /* ---------- story / about ---------- */\n  .story{padding:clamp(60px,9vw,110px) 0; background:var(--paper-2);}\n  .story .grid{display:grid; grid-template-columns:0.85fr 1fr; gap:clamp(30px,5vw,72px); align-items:center;}\n  .story figure{margin:0; position:relative;}\n  .story figure img{width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:2px;}\n  .story figure .tag{position:absolute; bottom:-1px; left:-1px; background:var(--green); color:#fff; font-size:12px; letter-spacing:.16em; text-transform:uppercase; padding:11px 18px; font-weight:600;}\n  .story p{font-size:17px;}\n  .story p + p{margin-top:6px;}\n\n  /* ---------- attorneys ---------- */\n  .attorneys{padding:clamp(64px,9vw,120px) 0;}\n  .attorneys .head{text-align:center; margin-bottom:clamp(40px,6vw,72px);}\n  .attorneys .head p{max-width:60ch; margin:14px auto 0;}\n  .att-row{display:grid; grid-template-columns:0.78fr 1fr; gap:clamp(28px,5vw,68px); align-items:center; padding:clamp(34px,5vw,56px) 0; border-top:1px solid var(--line);}\n  .att-row:last-of-type{border-bottom:1px solid var(--line);}\n  .att-row.rev{direction:rtl;}\n  .att-row.rev > *{direction:ltr;}\n  .att-photo{position:relative;}\n  .att-photo img{width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top center; border-radius:2px; box-shadow:var(--shadow);}\n  .att-photo .num{position:absolute; top:-20px; left:-10px; font-family:var(--serif); font-size:clamp(64px,9vw,120px); color:var(--green); opacity:.12; font-weight:600; line-height:1;}\n  .att-name{font-size:clamp(30px,3.6vw,44px); margin-bottom:2px;}\n  .att-role{font-family:var(--sans); font-weight:600; font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:18px;}\n  .tags{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}\n  .tag-chip{font-size:13px; font-weight:500; color:var(--green-700); background:var(--green-50); border:1px solid var(--green-300); border-radius:100px; padding:5px 13px; cursor:pointer; transition:all .18s; text-decoration:none; display:inline-block;} .tag-chip:hover{background:var(--green-700); color:#fff; border-color:var(--green-700);}\n  .att-bio{font-size:16px; color:var(--ink-soft); margin-bottom:18px;}\n  .att-bio.placeholder{position:relative;}\n  .att-links{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; font-size:14px; font-weight:600;}\n  .att-links a{color:var(--green); display:inline-flex; align-items:center; gap:6px; border-bottom:1.5px solid transparent; padding-bottom:1px;}\n  .att-links a:hover{border-color:var(--green);}\n  .ph-note{display:inline-block; font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--gold); background:#fbf3df; border:1px dashed var(--gold); padding:2px 9px; border-radius:4px; margin-bottom:8px;}\n\n  /* ---------- practice ---------- */\n  .practice{padding:clamp(64px,9vw,118px) 0; background:var(--green-700); color:#fff;}\n  .practice .eyebrow{color:var(--green-300);}\n  .practice .eyebrow::before{background:var(--green-300);}\n  .practice .head{display:flex; justify-content:space-between; align-items:flex-end; gap:30px; flex-wrap:wrap; margin-bottom:38px;}\n  .practice h2{color:#fff;}\n  .practice .head p{color:rgba(255,255,255,.72); max-width:44ch; margin:0;}\n  .pa-list{display:grid; grid-template-columns:repeat(2,1fr); gap:0 clamp(40px,6vw,90px);}\n  .pa-item{display:flex; align-items:baseline; gap:18px; padding:20px 4px; border-top:1px solid rgba(255,255,255,.16); cursor:default; transition:padding .2s;}\n  .pa-item:hover{padding-left:14px;}\n  .pa-item .pa-num{font-family:var(--serif); font-size:16px; color:var(--green-300); min-width:26px;}\n  .pa-item .pa-name{font-family:var(--serif); font-size:clamp(22px,2.4vw,28px); font-weight:500;}\n  .pa-item .pa-arrow{margin-left:auto; color:var(--green-300); opacity:0; transition:opacity .2s, transform .2s; font-size:18px;}\n  .pa-item:hover .pa-arrow{opaci .15s;\n    white-space:nowrap; border-bottom:none;\n  }\n  .dropdown-menu a:hover{background:rgba(255,255,255,.07); color:#fff;}\n  .dropdown-menu .dm-divider{height:1px; background:rgba(255,255,255,.08); margin:4px 0;}\n<\/style>\n<\/head>\n<body>\n\n  \n\n\n  <!-- ============ HEADER ============ -->\n  <header id=\"header\">\n    <div class=\"wrap\">\n      <a href=\"#top\" class=\"brand\"><img src=\"5c0b221b-21f7-4be0-adbf-2577d9aa0c45\" alt=\"The Firm, Attorneys at Law\"><\/a>\n      <nav class=\"main\">\n        <a href=\"#philosophy\">Philosophy<\/a>\n        <a href=\"#story\">About<\/a>\n        <a href=\"#attorneys\">Attorneys<\/a>\n        <div class=\"nav-dropdown\">\n        <a href=\"#\" onclick=\"event.preventDefault()\">Practice Areas<\/a>\n        <div class=\"dropdown-menu\">\n          <a href=\"practice-areas/general-civil-law.html\">General Civil Law<\/a>\n          <a href=\"practice-areas/breach-of-contract-and-construction-law.html\">Breach of Contract &amp; Construction Law<\/a>\n          <a href=\"practice-areas/juvenile-law.html\">Juvenile Law<\/a>\n          <a href=\"practice-areas/family-law.html\">Family Law<\/a>\n          <a href=\"practice-areas/criminal-defense.html\">Criminal Defense<\/a>\n          <div class=\"dm-divider\"><\/div>\n          <a href=\"practice-areas/auto-accident-personal-injury.html\">Auto Accident / Personal Injury<\/a>\n          <a href=\"practice-areas/landlord-representation-in-evictions.html\">Landlord Representation in Evictions<\/a>\n          <a href=\"practice-areas/conservatorships.html\">Conservatorships<\/a>\n          <a href=\"practice-areas/estates-probates.html\">Estates &amp; Probates<\/a>\n        <\/div>\n      <\/div>\n        <a href=\"#contact\">Contact<\/a>\n      <\/nav>\n      <div class=\"header-cta\">\n        <a href=\"tel:4234088887\" class=\"phone-link\">\u260e 423-408-8887<\/a>\n      <\/div>\n      <button class=\"burger\" id=\"burger\" aria-label=\"Open menu\"><i><\/i><i><\/i><i><\/i><\/button>\n    <\/div>\n  <\/header>\n\n  <!-- ============ MOBILE MENU ============ -->\n  <div class=\"mobile-menu\" id=\"mobileMenu\">\n    <button class=\"mm-close\" id=\"mmClose\" aria-label=\"Close menu\">\u00d7<\/button>\n    <a href=\"#philosophy\">Philosophy<\/a>\n    <a href=\"#story\">About<\/a>\n    <a href=\"#attorneys\">Attorneys<\/a>\n    <a href=\"practice-areas/general-civil-law.html\">General Civil Law<\/a>\n    <a href=\"practice-areas/breach-of-contract-and-construction-law.html\">Breach of Contract &amp; Construction<\/a>\n    <a href=\"practice-areas/juvenile-law.html\">Juvenile Law<\/a>\n    <a href=\"practice-areas/family-law.html\">Family Law<\/a>\n    <a href=\"practice-areas/criminal-defense.html\">Criminal Defense<\/a>\n    <a href=\"practice-areas/auto-accident-personal-injury.html\">Auto Accident / Personal Injury<\/a>\n    <a href=\"practice-areas/landlord-representation-in-evictions.html\">Landlord / Evictions<\/a>\n    <a href=\"practice-areas/conservatorships.html\">Conservatorships<\/a>\n    <a href=\"practice-areas/estates-probates.html\">Estates &amp; Probates<\/a>\n    <a href=\"#contact\">Contact<\/a>\n    <div class=\"mm-foot\">\n      <a href=\"tel:4234088887\">\u260e 423-408-8887<\/a>\n      <a href=\"mailto:thefirmtn@gmail.com\">thefirmtn@gmail.com<\/a>\n    <\/div>\n  <\/div>\n\n  <!-- ============ HERO ============ -->\n  <section class=\"hero\" id=\"top\">\n    <img class=\"bg\" src=\"https://thefirmtn.net/wp-content/uploads/2026/01/Possible-Homepage-Image-Cropped-scaled.jpg\" alt=\"The Firm, Kingsport, Tennessee\">\n    <div class=\"scrim\"><\/div>\n    <div class=\"hero-shade\" id=\"heroShade\"><\/div>\n    <div class=\"wrap\" style=\"padding: 150px 28px 60px\">\n      <h1 id=\"heroTitle\">The Firm<\/h1>\n      <p class=\"tagline\" id=\"heroTagline\" style=\"margin: 10px 0px\">The personal attention of a solo practitioner, with the shared strength of a firm.<\/p>\n      <p class=\"eyebrow\" id=\"heroLocation\">KINGSPORT, BRISTOL, AND JOHNSON CITY TENNESSEE<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ============ PHILOSOPHY ============ -->\n  <section class=\"philosophy\" id=\"philosophy\">\n    <div class=\"wrap\">\n      <p class=\"eyebrow center\">Our Philosophy<\/p>\n      <p class=\"quote\">Every client deserves to be treated with <span class=\"hl\">honor and respect.<\/span><\/p>\n      <p>We recognize that people rarely seek legal counsel on a good day. The stress, uncertainty, and financial concern that lead someone to hire an attorney are often among the most difficult experiences of their life. We take that responsibility seriously, and we place our clients' needs above our own.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ============ STORY / ABOUT ============ -->\n  <section class=\"story\" id=\"story\">\n    <div class=\"wrap\">\n      <div class=\"grid\">\n        <figure>\n          <img src=\"https://thefirmtn.net/wp-content/uploads/2026/01/front-of-building-200-1024x608.jpg\" alt=\"The Firm office at 200 E. Main Street, Kingsport\">\n          <span class=\"tag\">200 E. Main St.<\/span>\n        <\/figure>\n        <div>\n          <p class=\"eyebrow\">About The Firm<\/p>\n          <h2 class=\"title\">Born from a simple idea, over lunch.<\/h2>\n          <p>One day, while sharing lunch, a group of attorneys realized they all wanted their own independent practices, yet valued the benefits of collaboration. They envisioned a shared space where they could keep individual offices while sharing conference rooms, staff, and ideas. From that conversation, The Firm was created.<\/p>\n          <p>The Firm is an association of independent attorneys, each operating their own solo practice within a shared environment. No attorney supervises another. When you hire one of us, you hire that attorney directly, the dedication of a solo practitioner, combined with the collective resources of a larger firm.<\/p>\n          <p>Every case matters to us, whether or not you ultimately choose to hire one of our attorneys. We are equally committed to helping you find the right legal fit, even if that means referring you elsewhere.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ ATTORNEYS ============ -->\n  <section class=\"attorneys\" id=\"attorneys\">\n    <div class=\"wrap\">\n      <div class=\"head\">\n        <p class=\"eyebrow center\">The Attorneys<\/p>\n        <h2 class=\"title\">Three founding attorneys.<br>One shared address.<\/h2>\n        <p>Each attorney practices independently. Choose the one whose experience fits your situation, and work with them directly.<\/p>\n      <\/div>\n\n      <!-- Samuel Hall -->\n      <article class=\"att-row\">\n        <div class=\"att-photo\">\n          <span class=\"num\">01<\/span>\n          <img src=\"https://thefirmtn.net/wp-content/uploads/2026/01/Sam-Close-683x1024.jpg\" alt=\"Samuel Hall\">\n        <\/div>\n        <div>\n          <h3 class=\"att-name\">Samuel Hall<\/h3>\n          <p class=\"att-role\">Founding Attorney<\/p>\n          <div class=\"tags\">\n            <a href=\"practice-areas/auto-accident-personal-injury.html\" class=\"tag-chip\">Auto Accident / Personal Injury<\/a>\n            <a href=\"practice-areas/breach-of-contract-and-construction-law.html\" class=\"tag-chip\">Breach of Contract and Construction Law<\/a>\n            <a href=\"practice-areas/conservatorships.html\" class=\"tag-chip\">Conservatorships<\/a>\n            <a href=\"practice-areas/criminal-defense.html\" class=\"tag-chip\">Criminal Defense<\/a>\n            <a href=\"practice-areas/estates-probates.html\" class=\"tag-chip\">Estates &amp; Probates<\/a>\n            <a href=\"practice-areas/family-law.html\" class=\"tag-chip\">Family Law<\/a>\n            <a href=\"practice-areas/general-civil-law.html\" class=\"tag-chip\">General Civil Law<\/a>\n            <a href=\"practice-areas/juvenile-law.html\" class=\"tag-chip\">Juvenile Law<\/a>\n          <\/div>\n          <p class=\"att-bio\">Samuel Hall was born in Knoxville, Tennessee and grew up in Morristown and Bybee, Tennessee. Sam graduated from Jefferson County High School in 2009, and then graduated Walters State Community College in 2011 with his Associates of Applied Science in Nursing. He began working at Covenant Health in 2012 as a Registered Nurse, going on to also work with Ballad Health (formerly Mountain States Health Alliance) at Indian Path Medical Center for about ten years. He continued on to complete his Bachelors of Science in Nursing at South University in Savannah, Georgia, in 2015. He has also served as an expert witness on medical malpractice cases.<\/p>\n          <p class=\"att-bio\">Sam graduated from Lincoln Memorial University\u2019s Duncan School of Law in May 2019 magna cum laude. Sam received several CALI awards in Lincoln\u2019s Constitution, Advanced Trial Advocacy, and MEE Studies II. His additional law school accolades include receiving the Lincoln Lawyer Award for service, founding the Young Americans for Freedom law school chapter, joining the Sergeant in Arms of the Sons of Justice, and becoming Vice President of the Federalist Society. In law school, his article, \u201cPresident Lincoln: Bending the Iron and Cracking the Code,\u201d was published, delving into the constitutionality of President Lincoln\u2019s use of executive orders during the Civil War.<\/p>\n          <p class=\"att-bio\">Currently, Sam was the 2025 Kingsport Bar Association President, and past president of Rotary of Kingsport-Sunrise club, while also being active in his masonic lodge. Sam currently serves on the board of directors for the Paramount Theater in Bristol, Tennessee as well as the being a member of the Tennessee Bar Association and on the House of Delegates.<\/p>\n          <p class=\"att-bio\">Sam is married to his high school sweetheart, Lanna, who is also a nurse practitioner. In his spare time, Sam enjoys playing a round of golf while enjoying a cigar or taking his beautiful wife and his four dogs, Clementine, Clover, Margeaux, and Marigold to the dog park.<\/p>\n        <\/div>\n      <\/article>\n\n      <!-- Abbey R.C. Sims -->\n      <article class=\"att-row rev\">\n        <div class=\"att-photo\">\n          <span class=\"num\">02<\/span>\n          <img src=\"https://thefirmtn.net/wp-content/uploads/2025/12/4018fc4147ce314c1938a885eee3437bfc46bfce-683x1024.jpg\" alt=\"Abbey R.C. Sims\">\n        <\/div>\n        <div>\n          <h3 class=\"att-name\">Abbey R.C. Sims<\/h3>\n          <p class=\"att-role\">Founding Attorney<\/p>\n          <div class=\"tags\">\n            <a href=\"practice-areas/auto-accident-personal-injury.html\" class=\"tag-chip\">Auto Accident / Personal Injury<\/a>\n            <a href=\"practice-areas/conservatorships.html\" class=\"tag-chip\">Conservatorships<\/a>\n            <a href=\"practice-areas/criminal-defense.html\" class=\"tag-chip\">Criminal Defense<\/a>\n            <a href=\"practice-areas/estates-probates.html\" class=\"tag-chip\">Estates &amp; Probates<\/a>\n            <a href=\"practice-areas/family-law.html\" class=\"tag-chip\">Family Law<\/a>\n            <a href=\"practice-areas/general-civil-law.html\" class=\"tag-chip\">General Civil Law<\/a>\n            <a href=\"practice-areas/juvenile-law.html\" class=\"tag-chip\">Juvenile Law<\/a>\n          <\/div>\n          <p class=\"att-bio\">Abbey Raye Conkin Sims is a Sullivan County native, who grew up in the Sullivan Gardens area of Kingsport, Tennessee. She attended Sullivan South High School, graduating in 2014. She then attended East Tennessee State University and earned her Bachelor of Science degree in Criminal Justice and Criminology with a minor in Legal Studies. Abbey then attended Lincoln Memorial University\u2019s Duncan School of Law, obtaining her Juris Doctor in May of 2021.<\/p>\n          <p class=\"att-bio\">Abbey moved back home to this area in 2021 and began working as an attorney. In 2025, Abbey opened her own practice at The Firm. Abbey is married to Dustin, a firefighter at the Kingsport Fire Department. In her free time, Abbey enjoys reading, cheering for the Tennessee Volunteers, and spending quality time with family, friends, and her dog, Cub.<\/p>\n          <p class=\"att-bio\">Abbey is a member of Calvary Church in Johnson City, Tennessee, as well as a member of the Kingsport Bar Association, the Tennessee Association of Criminal Defense Lawyers, and the National Association of Criminal Defense Lawyers.<\/p>\n        <\/div>\n      <\/article>\n\n      <!-- Nicholas S. Davenport, V -->\n      <article class=\"att-row\">\n        <div class=\"att-photo\">\n          <span class=\"num\">03<\/span>\n          <img src=\"https://thefirmtn.net/wp-content/uploads/2026/01/Nicholas1-683x1024.jpg\" alt=\"Nicholas S. Davenport, V\">\n        <\/div>\n        <div>\n          <h3 class=\"att-name\">Nicholas S. Davenport, V<\/h3>\n          <p class=\"att-role\">Founding Attorney<\/p>\n          <div class=\"tags\">\n            <a href=\"practice-areas/estates-probates.html\" class=\"tag-chip\">Estates &amp; Probates<\/a>\n            <a href=\"practice-areas/conservatorships.html\" class=\"tag-chip\">Conservatorships<\/a>\n            <a href=\"practice-areas/criminal-defense.html\" class=\"tag-chip\">Criminal Defense<\/a>\n            <a href=\"practice-areas/general-civil-law.html\" class=\"tag-chip\">General Civil Law<\/a>\n            <a href=\"practice-areas/auto-accident-personal-injury.html\" class=\"tag-chip\">Auto Accident / Personal Injury<\/a>\n            <a href=\"practice-areas/landlord-representation-in-evictions.html\" class=\"tag-chip\">Landlord Representation in Evictions<\/a>\n          <\/div>\n          <p class=\"att-bio\">Nicholas S. Davenport, V is an attorney based in Kingsport, Tennessee, serving clients throughout the East Tennessee region.<\/p>\n          <p class=\"att-bio\">He earned his Juris Doctor from the Lincoln Memorial University Duncan School of Law, where he served as a Senator in the Student Bar Association and as Chairman of the Elections Committee. Nick completed his undergraduate studies at the University of Tennessee, Knoxville, earning a Bachelor of Arts degree and serving on the Board of Judicial Affairs.<\/p>\n          <p class=\"att-bio\">Nick was admitted to the Tennessee Bar in 2013 and has developed broad legal experience in areas including estate planning, probate administration, healthcare law, debt collection, conservatorships and guardianships, civil litigation (both plaintiff and defense), landlord-tenant disputes, and criminal law. His professional background includes work with Legal Aid of East Tennessee, the Law Firm of Ambrose, Wilson, Grimm &amp; Durand in Knoxville, and service as a prosecutor with the Sullivan County District Attorney\u2019s Office.<\/p>\n          <p class=\"att-bio\">He is an active member of the Kingsport Bar Association and the Tennessee Bar Association, and a former member of the Knoxville Bar Association. Beyond his legal practice, Nick volunteers as a board member for the First Presbyterian Children\u2019s Center and the Hamblen County Anti-Drug Coalition. He also supports organizations such as the University of Tennessee, Quail Forever, and Ducks Unlimited. Nick lives in Kingsport with his wife, Bethany, and their two children, Nicholas VI and Adelei Davenport.<\/p>\n        <\/div>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <!-- ============ PRACTICE AREAS ============ -->\n  \n\n  <!-- ============ CONTACT / CONSULT ============ -->\n  <section class=\"consult\" id=\"contact\">\n    <div class=\"wrap\">\n      <div class=\"grid\">\n        <div>\n          <p class=\"eyebrow\">How Can We Help?<\/p>\n          <h2 class=\"title\">Request a Consultation<\/h2>\n          <p class=\"call-line\">Call us now at <a href=\"tel:4234088887\">423-408-8887<\/a> or complete the form below.<\/p>\n          <form method=\" ational purposes only and should not be construed as legal advice.<\/p>\n        <p>\u00a9 2026 The Firm. All rights reserved.<\/p>\n      <\/div>\n    <\/div>\n  <\/footer>\n\n<script>\n  // header scroll state\n  const header = document.getElementById('header');\n  const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 60);\n  onScroll();\n  window.addEventListener('scroll', onScroll, {passive:true});\n\n  // mobile menu\n  const menu = document.getElementById('mobileMenu');\n  const openMenu = () => { menu.classList.add('open'); document.body.style.overflow='hidden'; };\n  const closeMenu = () => { menu.classList.remove('open'); document.body.style.overflow=''; };\n  document.getElementById('burger').addEventListener('click', openMenu);\n  document.getElementById('mmClose').addEventListener('click', closeMenu);\n  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));\n\n  // form acknowledgement\n  var _cf = document.querySelector('form[id^=gform_]');\n  if (_cf) _cf.addEventListener('submit', () => {\n    var fn = document.getElementById('formNote'); if (fn) fn.hidden = false;\n  });\n<\/script>\n\n<style>\n  /* hero dimming overlay (Tweaks) */\n  .hero-shade{position:absolute; inset:0; background:#0d120c; opacity:0; pointer-events:none; transition:opacity .25s ease;}\n\n  /* Tweaks panel */\n  .tweaks-panel{position:fixed; right:20px; bottom:20px; z-index:1000; width:282px; max-width:calc(100vw - 40px);\n    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px;\n    box-shadow:0 26px 64px -22px rgba(20,28,22,.55); font-family:var(--sans);\n    transform:translateY(16px); opacity:0; visibility:hidden; transition:opacity .2s ease, transform .2s ease, visibility .2s;}\n  .tweaks-panel.open{transform:none; opacity:1; visibility:visible;}\n  .tweaks-head{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--line);}\n  .tweaks-head span{font-family:var(--serif); font-size:20px; font-weight:600;}\n  .tweaks-close{background:none; border:none; font-size:23px; line-height:1; color:var(--ink-soft); cursor:pointer; padding:0 2px;}\n  .tweaks-close:hover{color:var(--ink);}\n  .tweaks-body{padding:16px; display:flex; flex-direction:column; gap:18px;}\n  .tweak-group{display:flex; flex-direction:column; gap:9px;}\n  .tweak-label{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);}\n  .tweak-label span{color:var(--green); font-weight:600; letter-spacing:0;}\n  .tweak-seg{display:flex; gap:6px;}\n  .tweak-seg button{flex:1; font-family:var(--sans); font-size:12.5px; font-weight:600; padding:8px 6px; border:1px solid var(--line);\n    background:#fff; color:var(--ink-soft); border-radius:6px; cursor:pointer; transition:all .15s;}\n  .tweak-seg button:hover{border-color:var(--ink-faint);}\n  .tweak-seg button.active{background:var(--green); color:#fff; border-color:var(--green);}\n  .tweak-swatches{display:flex; gap:11px;}\n  .tweak-swatches button{width:30px; height:30px; border-radius:50%; border:2px solid #fff; cursor:pointer; box-shadow:0 0 0 1px var(--line); padding:0;}\n  .tweak-swatches button.active{box-shadow:0 0 0 2px var(--ink);}\n  .tweaks-panel input[type=range]{width:100%; accent-color:var(--green);}\n<\/style>\n\n<div class=\"tweaks-panel\" id=\"tweaksPanel\">\n  <div class=\"tweaks-head\"><span>Tweaks<\/span><button class=\"tweaks-close\" id=\"tweaksClose\" aria-label=\"Close\">\u00d7<\/button><\/div>\n  <div class=\"tweaks-body\">\n    <div class=\"tweak-group\">\n      <label class=\"tweak-label\">Location line<\/label>\n      <div class=\"tweak-seg\" id=\"segLocation\">\n        <button data-val=\"below\">Below tagline<\/button>\n        <button data-val=\"above\">Above title<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"tweak-group\">\n      <label class=\"tweak-label\">Accent color<\/label>\n      <div class=\"tweak-swatches\" id=\"swAccent\">\n        <button data-val=\"#34503c\" style=\"background:#34503c\"><\/button>\n        <button data-val=\"#2f5d52\" style=\"background:#2f5d52\"><\/button>\n        <button data-val=\"#5a6b3c\" style=\"background:#5a6b3c\"><\/button>\n        <button data-val=\"#7a5230\" style=\"background:#7a5230\"><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"tweak-group\">\n      <label class=\"tweak-label\">Hero photo dimming <span id=\"heroShadeVal\">18%<\/span><\/label>\n      <input type=\"range\" min=\"0\" max=\"70\" step=\"1\" id=\"rngShade\">\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"locationPos\": \"below\",\n    \"accent\": \"#34503c\",\n    \"heroShade\": 18\n  }/*EDITMODE-END*/;\n\n  const root = document.documentElement;\n  const elLocation = document.getElementById('heroLocation');\n  const elTagline = document.getElementById('heroTagline');\n  const elTitle = document.getElementById('heroTitle');\n  const elShade = document.getElementById('heroShade');\n  const panel = document.getElementById('tweaksPanel');\n  const darker = (hex, pct) => 'color-mix(in srgb, ' + hex + ' ' + (100 - pct) + '%, #000)';\n\n  function apply(){\n    if (elLocation && elTagline && elTitle){\n      if (TWEAKS.locationPos === 'above') elTitle.before(elLocation);\n      else elTagline.after(elLocation);\n    }\n    root.style.setProperty('--green', TWEAKS.accent);\n    root.style.setProperty('--green-700', darker(TWEAKS.accent, 24));\n    if (elShade) elShade.style.opacity = (TWEAKS.heroShade / 100);\n    document.querySelectorAll('#segLocation button').forEach(b => b.classList.toggle('active', b.dataset.val === TWEAKS.locationPos));\n    document.querySelectorAll('#swAccent button').forEach(b => b.classList.toggle('active', b.dataset.val === TWEAKS.accent));\n    const rng = document.getElementById('rngShade'); if (rng) rng.value = TWEAKS.heroShade;\n    const lbl = document.getElementById('heroShadeVal'); if (lbl) lbl.textContent = TWEAKS.heroShade + '%';\n  }\n  const persist = (edits) => { try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:edits}, '*'); } catch(e){} };\n\n  apply();\n\n  document.getElementById('segLocation').addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    TWEAKS.locationPos = b.dataset.val; apply(); persist({locationPos: TWEAKS.locationPos});\n  });\n  document.getElementById('swAccent').addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    TWEAKS.accent = b.dataset.val; apply(); persist({accent: TWEAKS.accent});\n  });\n  const rng = document.getElementById('rngShade');\n  rng.addEventListener('input', () => {\n    TWEAKS.heroShade = +rng.value;\n    if (elShade) elShade.style.opacity = (TWEAKS.heroShade / 100);\n    document.getElementById('heroShadeVal').textContent = TWEAKS.heroShade + '%';\n  });\n  rng.addEventListener('change', () => persist({heroShade: TWEAKS.heroShade}));\n\n  document.getElementById('tweaksClose').addEventListener('click', () => {\n    panel.classList.remove('open');\n    try { window.parent.postMessage({type:'__edit_mode_dismissed'}, '*'); } catch(e){}\n  });\n\n  window.addEventListener('message', e => {\n    const t = e.data && e.data.type;\n    if (t === '__activate_edit_mode') panel.classList.add('open');\n    else if (t === '__deactivate_edit_mode') panel.classList.remove('open');\n  });\n  try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(e){}\n})();\n<\/script>\n\n\n\n  <script>\n    (function () {\n      var params = new URLSearchParams(window.location.search);\n      var atty = params.get('atty');\n      if (!atty) return;\n      function trySelect() {\n        var sel = document.getElementById('attorney-select');\n        if (!sel) { setTimeout(trySelect, 100); return; }\n        if (sel.querySelector('option[value=\"' + atty + '\"]')) {\n          sel.value = atty;\n          sel.dispatchEvent(new Event('change'));\n        }\n        // Scroll into view\n        var section = document.getElementById('contact');\n        if (section) section.scrollIntoView({ behavior: 'smooth' });\n      }\n      trySelect();\n    })();\n  <\/script>\n<\/body><\/html>"</script>
